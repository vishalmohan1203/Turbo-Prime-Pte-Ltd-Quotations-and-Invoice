services:
  - type: web
    name: turbo-prime-quotations
    runtime: python
    plan: starter            # a persistent disk needs a paid plan
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: APP_PASSWORD
        sync: false          # you type the password in the Render dashboard
      - key: DATA_DIR
        value: /var/data
    disk:
      name: quotation-data
      mountPath: /var/data
      sizeGB: 1
