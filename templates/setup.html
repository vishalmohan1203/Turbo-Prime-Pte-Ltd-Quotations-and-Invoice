{% extends "base.html" %}
{% block title %}First-time setup{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:60px auto">
  <h2>First-time setup</h2>
  <p class="muted" style="margin-top:0">Create the administrator account. You can add the other users afterwards.</p>
  <form method="post" autocomplete="off">
    <label for="username">Username</label>
    <input id="username" name="username" autofocus required>
    <div style="height:10px"></div>
    <label for="password">Password (at least 8 characters)</label>
    <input type="password" id="password" name="password" autocomplete="new-password" required>
    <div style="height:10px"></div>
    <label for="confirm">Repeat password</label>
    <input type="password" id="confirm" name="confirm" autocomplete="new-password" required>
    <p><button class="btn" type="submit">Create administrator</button></p>
  </form>
</div>
{% endblock %}
